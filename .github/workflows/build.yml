name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-supabase-nutrition-pwa
    env:
      # The app uses DATABASE_URL at runtime, but the Next.js production build
      # imports database-backed route modules during route analysis. CI only
      # needs a syntactically valid URL; no database connection is made here.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run typecheck

      - run: npm run build
